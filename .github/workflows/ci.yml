name: CI (jira-sprints-nestjs)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'jira-sprints-nestjs/**'
      - 'jira-contracts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'jira-sprints-nestjs/**'
      - 'jira-contracts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-coverage:
    name: NestJS Test & Coverage Enforcement (>= 60%)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: jira-sprints-nestjs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            jira-contracts/package-lock.json
            jira-sprints-nestjs/package-lock.json

      - name: Build Contracts Stubs
        run: |
          cd ../jira-contracts
          npm ci || npm install
          npm run build

      - name: Install MS2 Dependencies
        run: npm ci || npm install

      - name: Build NestJS Application
        run: npm run build

      - name: Run Unit Tests with Coverage Profile
        run: npm run test:cov -- --ci --colors
        env:
          CI: true

      - name: Enforce >= 60% Coverage Threshold Gate
        run: |
          chmod +x scripts/check-coverage.sh
          ./scripts/check-coverage.sh coverage/coverage-summary.json 60.0

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-sprints-nestjs-coverage
          path: |
            jira-sprints-nestjs/coverage/
          retention-days: 14
