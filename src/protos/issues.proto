syntax = "proto3";

package jira.issues.v1;

option go_package = "jira-contracts/gen/go/issues/v1;issuesv1";
option csharp_namespace = "JiraAi.Contracts.Issues.V1";

enum IssueStatus {
  ISSUE_STATUS_UNSPECIFIED = 0;
  ISSUE_STATUS_TODO = 1;
  ISSUE_STATUS_IN_PROGRESS = 2;
  ISSUE_STATUS_IN_REVIEW = 3;
  ISSUE_STATUS_DONE = 4;
}

enum IssuePriority {
  ISSUE_PRIORITY_UNSPECIFIED = 0;
  ISSUE_PRIORITY_LOW = 1;
  ISSUE_PRIORITY_MEDIUM = 2;
  ISSUE_PRIORITY_HIGH = 3;
  ISSUE_PRIORITY_CRITICAL = 4;
}

enum IssueType {
  ISSUE_TYPE_UNSPECIFIED = 0;
  ISSUE_TYPE_STORY = 1;
  ISSUE_TYPE_TASK = 2;
  ISSUE_TYPE_BUG = 3;
  ISSUE_TYPE_EPIC = 4;
}

message Issue {
  string id = 1;
  string key = 2;
  string project_id = 3;
  string title = 4;
  string description = 5;
  IssueStatus status = 6;
  IssuePriority priority = 7;
  IssueType type = 8;
  int32 story_points = 9;
  string sprint_id = 10;
  string assignee_id = 11;
  string reporter_id = 12;
  string acceptance_criteria = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
  // Parent epic of this issue; empty when the issue has no parent.
  string parent_id = 16;
}

message CreateIssueRequest {
  string project_id = 1;
  string title = 2;
  string description = 3;
  IssuePriority priority = 4;
  IssueType type = 5;
  int32 story_points = 6;
  string sprint_id = 7;
  string assignee_id = 8;
  string reporter_id = 9;
  string acceptance_criteria = 10;
  // Optional parent epic. It must be an EPIC of the same project.
  string parent_id = 11;
}

message CreateIssueResponse {
  Issue issue = 1;
}

message GetIssueRequest {
  string id = 1;
}

message GetIssueResponse {
  Issue issue = 1;
}

message ListIssuesRequest {
  string project_id = 1;
  string sprint_id = 2;
  IssueStatus status = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ListIssuesResponse {
  repeated Issue issues = 1;
  int32 total_count = 2;
}

message UpdateIssueStatusRequest {
  string id = 1;
  IssueStatus status = 2;
}

message UpdateIssueStatusResponse {
  Issue issue = 1;
}

message BatchUpdateIssueSprintRequest {
  repeated string issue_ids = 1;
  string sprint_id = 2;
}

message BatchUpdateIssueSprintResponse {
  int32 updated_count = 1;
  repeated Issue issues = 2;
}

service IssueService {
  rpc CreateIssue(CreateIssueRequest) returns (CreateIssueResponse);
  rpc GetIssue(GetIssueRequest) returns (GetIssueResponse);
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse);
  rpc UpdateIssueStatus(UpdateIssueStatusRequest) returns (UpdateIssueStatusResponse);
  rpc BatchUpdateIssueSprint(BatchUpdateIssueSprintRequest) returns (BatchUpdateIssueSprintResponse);
}

// ============================================================================
// Identity and workspaces (owned by MS1; the BFF only issues the JWT)
// Timestamps are Unix epoch milliseconds, as in Issue.
// Errors: INVALID_ARGUMENT (bad input), ALREADY_EXISTS (duplicate email/key),
// UNAUTHENTICATED (wrong credentials), PERMISSION_DENIED (role not allowed),
// NOT_FOUND (unknown user, workspace, project or issue).
// ============================================================================

enum WorkspaceRole {
  WORKSPACE_ROLE_UNSPECIFIED = 0;
  WORKSPACE_ROLE_OWNER = 1;
  WORKSPACE_ROLE_ADMIN = 2;
  WORKSPACE_ROLE_MEMBER = 3;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  int64 created_at = 4;
}

message Workspace {
  string id = 1;
  string name = 2;
  // Role of the user the workspace was listed for.
  WorkspaceRole role = 3;
  int64 created_at = 4;
}

// Creates the user (password hashed by MS1 with scrypt) and a personal workspace where the user is OWNER.
message RegisterUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message RegisterUserResponse {
  User user = 1;
  Workspace workspace = 2;
}

// Verifies email and password. Wrong credentials return UNAUTHENTICATED.
message AuthenticateUserRequest {
  string email = 1;
  string password = 2;
}

message AuthenticateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message ListUserWorkspacesRequest {
  string user_id = 1;
}

message ListUserWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

// Adds an existing user (by email) as MEMBER. The requester must be OWNER or ADMIN of the workspace.
message AddWorkspaceMemberRequest {
  string requester_id = 1;
  string workspace_id = 2;
  string member_email = 3;
}

message AddWorkspaceMemberResponse {
  User member = 1;
  WorkspaceRole role = 2;
}

message GetMemberRoleRequest {
  string workspace_id = 1;
  string user_id = 2;
}

// role is WORKSPACE_ROLE_UNSPECIFIED when the user is not a member.
message GetMemberRoleResponse {
  WorkspaceRole role = 1;
}

service IdentityService {
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  rpc AuthenticateUser(AuthenticateUserRequest) returns (AuthenticateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUserWorkspaces(ListUserWorkspacesRequest) returns (ListUserWorkspacesResponse);
  rpc AddWorkspaceMember(AddWorkspaceMemberRequest) returns (AddWorkspaceMemberResponse);
  rpc GetMemberRole(GetMemberRoleRequest) returns (GetMemberRoleResponse);
}

// ============================================================================
// Projects inside a workspace
// ============================================================================

message Project {
  string id = 1;
  string workspace_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
  int64 created_at = 6;
}

// The requester must be OWNER or ADMIN of the workspace.
message CreateProjectRequest {
  string requester_id = 1;
  string workspace_id = 2;
  string key = 3;
  string name = 4;
  string description = 5;
}

message CreateProjectResponse {
  Project project = 1;
}

// The requester must be a member of the workspace. Newest projects first.
message ListProjectsRequest {
  string requester_id = 1;
  string workspace_id = 2;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message CheckProjectAccessRequest {
  string user_id = 1;
  string project_id = 2;
}

// allowed is false (not an error) when the user is not a member of the project's workspace.
message CheckProjectAccessResponse {
  bool allowed = 1;
  WorkspaceRole role = 2;
  string workspace_id = 3;
}

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CheckProjectAccess(CheckProjectAccessRequest) returns (CheckProjectAccessResponse);
}

// ============================================================================
// Work logs (hours per issue)
// ============================================================================

message WorkLog {
  string id = 1;
  string project_id = 2;
  string issue_id = 3;
  string issue_key = 4;
  string issue_title = 5;
  string user_id = 6;
  string user_name = 7;
  // Sprint of the issue when the hours were logged; empty when it was in the backlog.
  string sprint_id = 8;
  double hours = 9;
  string note = 10;
  int64 logged_at = 11;
}

// The user must have access to the project and the issue must belong to it. 0 < hours <= 24.
message LogWorkRequest {
  string user_id = 1;
  string project_id = 2;
  string issue_id = 3;
  double hours = 4;
  string note = 5;
}

message LogWorkResponse {
  WorkLog work_log = 1;
}

// The requester must have access to the project. Newest entries first; limit 0 means the server default (100).
message ListWorkLogsRequest {
  string requester_id = 1;
  string project_id = 2;
  int32 limit = 3;
}

message ListWorkLogsResponse {
  repeated WorkLog entries = 1;
  // Sum of all the project's hours, not only the listed entries.
  double total_hours = 2;
}

message SumSprintHoursRequest {
  string project_id = 1;
  string sprint_id = 2;
}

message SumSprintHoursResponse {
  double total_hours = 1;
}

service WorkLogService {
  rpc LogWork(LogWorkRequest) returns (LogWorkResponse);
  rpc ListWorkLogs(ListWorkLogsRequest) returns (ListWorkLogsResponse);
  rpc SumSprintHours(SumSprintHoursRequest) returns (SumSprintHoursResponse);
}
